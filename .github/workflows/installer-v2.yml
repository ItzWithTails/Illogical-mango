name: installer-v2

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "installer/**"
      - "install"
      - "src/scripts/ilmango"
      - "src/shell.qml"
      - ".github/workflows/installer-v2.yml"
  pull_request:
    paths:
      - "installer/**"
      - "install"
      - "src/scripts/ilmango"
      - "src/shell.qml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check runtime launcher compatibility
        run: |
          bash -n ../src/scripts/ilmango
          grep -q 'command -v quickshell' ../src/scripts/ilmango
          ! grep -q 'pragma DefaultEnv' ../src/shell.qml

  release-binaries:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: ilmango-installer-linux-amd64
          - goarch: arm64
            asset: ilmango-installer-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
      - name: Build static installer
        working-directory: installer
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' -o ../${{ matrix.asset }} ./cmd/ilmango-installer-v2
      - name: Checksum
        run: sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release-repository-archive:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build repository archive
        shell: bash
        run: |
          set -euo pipefail
          asset="illogical-mango-${GITHUB_REF_NAME}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="illogical-mango-${GITHUB_REF_NAME}/" \
            --output="$asset" \
            "$GITHUB_SHA"
          sha256sum "$asset" > "$asset.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            illogical-mango-${{ github.ref_name }}.tar.gz
            illogical-mango-${{ github.ref_name }}.tar.gz.sha256
