# iNiR keybinds and autostart for the mango compositor.
#
# mango reads ~/.config/mango/config.conf and falls back to
# /etc/mango/config.conf. NOTE: it is `mango`, not `mangowm` — the latter is a
# directory mango never reads.
#
# Syntax: bind=<mods>,<key>,<func>[,arg...]
# Mods join with '+' and are case-insensitive; "none" means no modifier.
#
# IMPORTANT: mango's `spawn` re-joins comma-separated arguments with commas, so
# a command and its arguments must be passed as ONE space-separated argument:
#     bind=SUPER,V,spawn,inir clipboard toggle          # correct
#     bind=SUPER,V,spawn,inir,clipboard,toggle          # WRONG — runs "inir,clipboard,toggle"
#
# This file only carries the iNiR integration. Merge it into your own mango
# config; it deliberately does not redefine window management binds.

# ── Environment ──────────────────────────────────────────────────────────────
# Syntax: env=NAME,VALUE — mango setenv()s these before launching anything, so
# every app in the session inherits them.
#
# Do NOT set QT_QPA_PLATFORMTHEME=gtk3 here. The GTK platform theme replaces the
# Qt palette with GTK's, which discards the Material You colours the theming
# pipeline writes into ~/.config/kdeglobals — Dolphin and other KDE apps then
# render in stock Breeze while the rest of the desktop follows the wallpaper.
# Leave it unset (KDE apps read kdeglobals on their own) or set it to "kde"
# once plasma-integration is installed.
env=QT_QPA_PLATFORM,wayland

# ── Autostart ────────────────────────────────────────────────────────────────
# exec-once runs at compositor startup only (exec= would re-run on every config
# reload and spawn duplicate shells). `inir run --daemon` sets up the Qt/Wayland
# environment and launches `qs -n`, which refuses to start a second instance.
#
# This form assumes an installed payload (~/.config/quickshell/inir or
# /usr/share/quickshell/inir). Running straight from a git checkout instead?
# Point it at the checkout, or `inir run` aborts with "Could not find an iNiR
# shell payload":
#     exec-once=/path/to/checkout/scripts/inir run --daemon -c /path/to/checkout
exec-once=inir run --daemon

# ── Shell surfaces ───────────────────────────────────────────────────────────
bind=SUPER,space,spawn,inir overview toggle
bind=SUPER,V,spawn,inir clipboard toggle
bind=SUPER,comma,spawn,inir settings toggle
bind=SUPER,slash,spawn,inir cheatsheet toggle
# SUPER,N is mango's own switch_layout bind — use Shift to stay clear of it.
bind=SUPER+SHIFT,N,spawn,inir sidebarRight toggle
bind=SUPER,P,spawn,inir sidebarLeft toggle
bind=SUPER,D,spawn,inir dashboard toggle
bind=SUPER+SHIFT,W,spawn,inir panelFamily cycle

# ── Session and lock ─────────────────────────────────────────────────────────
bind=SUPER,L,spawn,inir lock activate
bind=CTRL+ALT,Delete,spawn,inir session toggle

# ── Capture ──────────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,S,spawn,inir region screenshot
bind=SUPER+SHIFT,X,spawn,inir region ocr
bind=SUPER+SHIFT,R,spawn,inir region record
bind=SUPER+SHIFT,C,spawn,inir region googleLens

# ── Media and volume OSD ─────────────────────────────────────────────────────
# `bindl` fires even when the session is locked, which is what you want for
# hardware media keys.
bindl=NONE,XF86AudioRaiseVolume,spawn,inir audio volumeUp
bindl=NONE,XF86AudioLowerVolume,spawn,inir audio volumeDown
bindl=NONE,XF86AudioMute,spawn,inir audio mute
bindl=NONE,XF86AudioMicMute,spawn,inir audio micMute
bindl=NONE,XF86AudioPlay,spawn,inir mpris playPause
bindl=NONE,XF86AudioNext,spawn,inir mpris next
bindl=NONE,XF86AudioPrev,spawn,inir mpris previous
bindl=NONE,XF86MonBrightnessUp,spawn,inir brightness increment
bindl=NONE,XF86MonBrightnessDown,spawn,inir brightness decrement
