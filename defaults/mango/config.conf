# Illogical-mango keybinds and autostart for the mango compositor.
#
# mango reads ~/.config/mango/config.conf and falls back to
# /etc/mango/config.conf. NOTE: it is `mango`, not `mangowm` — the latter is a
# directory mango never reads.
#
# Syntax: bind=<mods>,<key>,<func>[,arg...]
# Mods join with '+' and are case-insensitive; "none" means no modifier.
#
# IMPORTANT: mango's `spawn` re-joins comma-separated arguments with commas, so
# a command and its arguments must be passed as ONE space-separated argument:
#     bind=SUPER,V,spawn,ilmango clipboard toggle          # correct
#     bind=SUPER,V,spawn,ilmango,clipboard,toggle          # WRONG — runs "ilmango,clipboard,toggle"
#
# This file only carries the Illogical-mango integration. Merge it into your own mango
# config; it deliberately does not redefine window management binds.

# ── Environment ──────────────────────────────────────────────────────────────
# Syntax: env=NAME,VALUE — mango setenv()s these before launching anything, so
# every app in the session inherits them.
#
# Do NOT set QT_QPA_PLATFORMTHEME=gtk3 here. The GTK platform theme replaces the
# Qt palette with GTK's, which discards the Material You colours the theming
# pipeline writes into ~/.config/kdeglobals — Dolphin and other KDE apps then
# render in stock Breeze while the rest of the desktop follows the wallpaper.
# Leave it unset (KDE apps read kdeglobals on their own) or set it to "kde"
# once plasma-integration is installed.
env=QT_QPA_PLATFORM,wayland

# The pointer mango draws is an XCursor theme, not a gsettings value: gsettings
# reaches GTK applications only. Without these two lines the compositor falls
# back to the theme called "default", which on Arch inherits Adwaita — a black
# arrow that reads as a hollow outline against this shell's dark background.
# The installer also writes ~/.local/share/icons/default so the pointer is
# right even if this file is not merged into your own config.
env=XCURSOR_THEME,capitaine-cursors-light
env=XCURSOR_SIZE,24

# ── Autostart ────────────────────────────────────────────────────────────────
# exec-once runs at compositor startup only (exec= would re-run on every config
# reload and spawn duplicate shells). `ilmango run --daemon` sets up the Qt/Wayland
# environment and launches `qs -n`, which refuses to start a second instance.
#
# This form assumes an installed payload (~/.config/quickshell/ilmango or
# /usr/share/quickshell/ilmango). Running straight from a git checkout instead?
# Point it at the checkout, or `ilmango run` aborts with "Could not find an Illogical-mango
# shell payload":
#     exec-once=/path/to/checkout/scripts/ilmango run --daemon -c /path/to/checkout
exec-once=ilmango run --daemon

# ── Shell surfaces ───────────────────────────────────────────────────────────
bind=SUPER,space,spawn,ilmango overview toggle
bind=SUPER,V,spawn,ilmango clipboard toggle
bind=SUPER,comma,spawn,ilmango settings toggle
bind=SUPER,slash,spawn,ilmango cheatsheet toggle
# SUPER,N is mango's own switch_layout bind — use Shift to stay clear of it.
bind=SUPER+SHIFT,N,spawn,ilmango sidebarRight toggle
bind=SUPER,P,spawn,ilmango sidebarLeft toggle
bind=SUPER,D,spawn,ilmango dashboard toggle
bind=SUPER+SHIFT,W,spawn,ilmango panelFamily cycle

# ── Session and lock ─────────────────────────────────────────────────────────
bind=SUPER,L,spawn,ilmango lock activate
bind=CTRL+ALT,Delete,spawn,ilmango session toggle

# ── Capture ──────────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,S,spawn,ilmango region screenshot
bind=SUPER+SHIFT,X,spawn,ilmango region ocr
bind=SUPER+SHIFT,R,spawn,ilmango region record
bind=SUPER+SHIFT,C,spawn,ilmango region googleLens

# ── Media and volume OSD ─────────────────────────────────────────────────────
# `bindl` fires even when the session is locked, which is what you want for
# hardware media keys.
bindl=NONE,XF86AudioRaiseVolume,spawn,ilmango audio volumeUp
bindl=NONE,XF86AudioLowerVolume,spawn,ilmango audio volumeDown
bindl=NONE,XF86AudioMute,spawn,ilmango audio mute
bindl=NONE,XF86AudioMicMute,spawn,ilmango audio micMute
bindl=NONE,XF86AudioPlay,spawn,ilmango mpris playPause
bindl=NONE,XF86AudioNext,spawn,ilmango mpris next
bindl=NONE,XF86AudioPrev,spawn,ilmango mpris previous
bindl=NONE,XF86MonBrightnessUp,spawn,ilmango brightness increment
bindl=NONE,XF86MonBrightnessDown,spawn,ilmango brightness decrement
