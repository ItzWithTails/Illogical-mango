# Conventional desktop keybinds for the mango compositor.
#
# This file is appended to ilmango.conf only when the `keybinds` setting is
# `full`. It is the half that defines window management and application
# launchers — the half that can disagree with bindings you already have. With
# `keybinds=shell` none of this is written and your own bindings are the only
# ones in play.
#
# The set mirrors the niri configuration this project inherited from end-4, so
# the same keys do the same things whichever compositor you came from. Where
# mango's vocabulary differs, the nearest equivalent is used and noted.
#
# Syntax: bind=<mods>,<key>,<func>[,arg...]
#         axisbind=<mods>,UP|DOWN,<func>      — scroll wheel
# Mods join with '+'. `spawn` re-joins comma-separated arguments with commas,
# so a command and its arguments must be ONE space-separated argument.

# ── Applications ─────────────────────────────────────────────────────────────
bind=SUPER,t,spawn,ilmango terminal
bind=SUPER,Return,spawn,ilmango terminal
bind=SUPER,e,spawn,nautilus
bind=SUPER,w,spawn,ilmango browser
bind=SUPER,q,spawn,ilmango close-window

# ── Windows ──────────────────────────────────────────────────────────────────
# niri focuses columns; mango focuses by direction. Same keys, same intent.
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

bind=SUPER,f,togglefullscreen,
bind=SUPER,a,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,n,switch_layout
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized

bind=SUPER,minus,incgaps,-1
bind=SUPER,equal,incgaps,1
bind=SUPER+SHIFT,g,togglegaps

# ── Workspaces ───────────────────────────────────────────────────────────────
# niri's Mod+WheelScroll for workspaces; mango spells the wheel `axisbind`, and
# the _have_client variants skip empty workspaces the way the overview does.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# ── Monitors ─────────────────────────────────────────────────────────────────
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right

# ── Session ──────────────────────────────────────────────────────────────────
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,e,quit
